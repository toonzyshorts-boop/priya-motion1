
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Priya ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 background:#020205;
 color:white;
 font-family:monospace;
 min-height:100vh;
 overflow-x:hidden;
}

#matrix{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 z-index:0;
 pointer-events:none;
 opacity:.25;
}

.container{
 position:relative;
 z-index:1;
 min-height:100vh;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 padding:35px 12px;
}

.small{
 color:#ff5599;
 letter-spacing:4px;
 font-size:11px;
 margin-bottom:12px;
 text-align:center;
}

h1{
 color:#ff3987;
 font-size:clamp(38px,9vw,65px);
 letter-spacing:8px;
 text-shadow:0 0 15px #ff0066,0 0 35px #ff0066;
}

.subtitle{
 color:#ffc0d7;
 letter-spacing:2px;
 font-size:12px;
 text-align:center;
 margin:15px 0 25px;
}

.frame{
 width:min(94vw,460px);
 position:relative;
 padding:7px;
 border:1px solid #ff3987;
 border-radius:12px;
 background:#050505;
 box-shadow:0 0 20px #ff006655,0 0 50px #ff006622;
 overflow:hidden;
}

#art{
 display:block;
 width:100%;
 height:auto;
 background:#000;
 border-radius:7px;
}

.scan{
 position:absolute;
 left:7px;
 right:7px;
 top:7px;
 height:3px;
 background:#ff83b3;
 box-shadow:0 0 15px 5px #ff1676;
 animation:scan 4s linear infinite;
 pointer-events:none;
}

@keyframes scan{
 0%{top:7px}
 100%{top:calc(100% - 10px)}
}

.love{
 margin-top:28px;
 text-align:center;
 color:#ff6da5;
 font-size:clamp(17px,4.5vw,27px);
 letter-spacing:2px;
 font-weight:bold;
 text-shadow:0 0 10px #ff0066,0 0 25px #ff0066;
 animation:glow 1.5s infinite alternate;
}

@keyframes glow{
 from{opacity:.65}
 to{opacity:1}
}

.binary{
 color:#ff9fbd;
 text-align:center;
 font-size:11px;
 margin-top:13px;
 line-height:1.8;
 padding:0 10px;
 overflow-wrap:anywhere;
}

.heart{
 font-size:34px;
 color:#ff2875;
 margin-top:12px;
 animation:beat 1s infinite;
 text-shadow:0 0 15px #ff0066;
}

@keyframes beat{
 50%{transform:scale(1.3)}
}

.message{
 text-align:center;
 color:#ffd0e0;
 font-size:13px;
 line-height:1.9;
 margin-top:12px;
}

button{
 margin-top:22px;
 background:#190713;
 border:1px solid #ff3987;
 color:#ffc0d7;
 border-radius:30px;
 padding:12px 25px;
 font-family:monospace;
 cursor:pointer;
}

.status{
 color:#ff88b4;
 font-size:11px;
 margin-top:12px;
 text-align:center;
}

.footer{
 margin-top:20px;
 font-size:10px;
 color:#8d5870;
 letter-spacing:3px;
 text-align:center;
}

@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important}
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">

 <div class="small">A DIGITAL SURPRISE FOR YOU</div>

 <h1>PRIYA ❤️</h1>

 <div class="subtitle">
   YOUR PHOTO MADE WITH CODE
 </div>

 <div class="frame">
   <canvas id="art"></canvas>
   <div class="scan"></div>
 </div>

 <div class="status" id="status">
   INITIALIZING DIGITAL PORTRAIT...
 </div>

 <div class="love">
   I LOVE YOU FOREVER ❤️
 </div>

 <div class="binary" id="binary">
  01001001 00100000 01001100 01001111 01010110 01000101
 </div>

 <div class="heart">♥</div>

 <div class="message">
   Every pixel has a story.<br>
   Every code has a feeling.<br>
   <b>Forever Special, Priya ❤️</b>
 </div>

 <button onclick="restart()">↻ REPLAY PHOTO</button>

 <div class="footer">
   MADE WITH CODE & LOVE
 </div>

</div>

<!-- PHOTO FILE MUST BE NAMED priya.jpg -->

<script>

/* MATRIX BACKGROUND */

const matrix=document.getElementById("matrix");
const mx=matrix.getContext("2d");

let drops=[];
let mw=0,mh=0;

function resizeMatrix(){
 const dpr=Math.min(devicePixelRatio||1,2);

 mw=innerWidth;
 mh=innerHeight;

 matrix.width=mw*dpr;
 matrix.height=mh*dpr;

 mx.setTransform(dpr,0,0,dpr,0,0);

 drops=Array.from(
  {length:Math.ceil(mw/17)},
  ()=>Math.random()*mh/17
 );
}

function drawMatrix(){
 mx.fillStyle="rgba(2,2,5,.12)";
 mx.fillRect(0,0,mw,mh);

 mx.fillStyle="#ff3281";
 mx.font="13px monospace";

 drops.forEach((y,i)=>{
  mx.fillText(Math.random()>.5?"1":"0",i*17,y*17);

  if(y*17>mh && Math.random()>.97){
   drops[i]=0;
  }else{
   drops[i]+=.5;
  }
 });

 requestAnimationFrame(drawMatrix);
}

resizeMatrix();
drawMatrix();


/* LOAD PHOTO */

const photo=new Image();
photo.src="./priya.jpg";

const canvas=document.getElementById("art");
const ctx=canvas.getContext("2d");

const status=document.getElementById("status");

const chars="@#%*+=-:. ";

let points=[];
let cols=100;
let rows=0;
let cell=8;
let started=false;
let startTime=0;
let raf=0;
let paused=false;


/* CREATE ASCII IMAGE */

function makePortrait(){

 if(!photo.complete || !photo.naturalWidth){
  status.textContent="PHOTO NOT LOADED - CHECK priya.jpg";
  return;
 }

 // Preserve the complete photo ratio

 rows=Math.round(
  cols*photo.naturalHeight/photo.naturalWidth
 );

 const temp=document.createElement("canvas");
 temp.width=cols;
 temp.height=rows;

 const tctx=temp.getContext("2d");

 tctx.drawImage(photo,0,0,cols,rows);

 const data=tctx.getImageData(
  0,0,cols,rows
 ).data;

 canvas.width=cols*cell;
 canvas.height=rows*cell;

 points=[];

 for(let y=0;y<rows;y++){

  for(let x=0;x<cols;x++){

   const i=(y*cols+x)*4;

   const r=data[i];
   const g=data[i+1];
   const b=data[i+2];

   const brightness=
    (r*.299+g*.587+b*.114)/255;

   const index=Math.min(
    chars.length-1,
    Math.floor(brightness*(chars.length-1))
   );

   points.push({
    x:x*cell,
    y:y*cell,
    char:chars[index],
    brightness:brightness
   });

  }
 }

 status.textContent="DIGITAL PORTRAIT READY ♥";

 restart();
}


/* DRAW PHOTO WITH CHARACTERS */

function drawPortrait(time){

 if(paused)return;

 const elapsed=time-startTime;

 const progress=Math.min(1,elapsed/4500);

 ctx.fillStyle="#000";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 ctx.font="8px monospace";
 ctx.textBaseline="top";

 const reveal=progress*canvas.height;

 for(const p of points){

  if(p.y>reveal)continue;

  // Slight digital wave

  const wave=Math.sin(
   time/500+p.x*.02+p.y*.01
  );

  const b=Math.max(
   0,
   Math.min(1,p.brightness+wave*.025)
  );

  // Different shades of pink

  if(b>.72){
   ctx.fillStyle="#ffd1e2";
  }else if(b>.42){
   ctx.fillStyle="#ff75a8";
  }else if(b>.12){
   ctx.fillStyle="#c93670";
  }else{
   ctx.fillStyle="#62152f";
  }

  ctx.globalAlpha=.35+b*.65;

  // Random glitch symbols

  const ch=Math.random()<.006
   ? chars[Math.floor(Math.random()*chars.length)]
   : p.char;

  ctx.fillText(ch,p.x,p.y);
 }

 ctx.globalAlpha=1;

 // Continue drawing after reveal for digital shimmer

 raf=requestAnimationFrame(drawPortrait);
}


/* START / REPLAY */

function restart(){

 if(!points.length)return;

 cancelAnimationFrame(raf);

 paused=false;
 startTime=performance.now();

 status.textContent="GENERATING PRIYA IN CODE...";

 raf=requestAnimationFrame(drawPortrait);
}


/* LOVE BINARY TEXT */

const binaryMessages=[
 "01001001 00100000 01001100 01001111 01010110 01000101 00100000 01011001 01001111 01010101",
 "01000110 01001111 01010010 01000101 01010110 01000101 01010010",
 "01010000 01010010 01001001 01011001 01000001"
];

let bi=0;

setInterval(()=>{
 bi=(bi+1)%binaryMessages.length;
 document.getElementById("binary").textContent=
  binaryMessages[bi];
},2500);


/* PHOTO LOAD SUCCESS / ERROR */

photo.onload=()=>{
 makePortrait();
};

photo.onerror=()=>{
 status.textContent=
  "ERROR: priya.jpg NOT FOUND. UPLOAD PHOTO BESIDE index.html";
};

// Handle cached image

if(photo.complete && photo.naturalWidth){
 makePortrait();
}

window.addEventListener("resize",()=>{
 resizeMatrix();
});

</script>

</body>
  </html>
